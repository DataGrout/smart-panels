name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Docs build cleanly
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Public repo hygiene: the model is derived from public DataGrout surfaces and
  # must reference only those.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No internal references
        run: |
          # The pattern itself lives in this file, so the workflow directory is
          # excluded from its own scan.
          if grep -rniE "lib/data_grout|/Users/|manifold|agentsmith|elastic-2|governor|warden" --include="*.rs" --include="*.md" --include="*.toml" --exclude-dir=.github --exclude-dir=target . ; then
            echo "internal path reference found"; exit 1
          fi
