[workspace]
resolver = "2"
members = [
    "datagrout-panels",
    "datagrout-panels-egui",
    "datagrout-panels-mcp",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
authors = ["DataGrout"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/DataGrout/smart-panels"
homepage = "https://datagrout.ai"

[workspace.dependencies]
datagrout-panels = { version = "0.2.0", path = "datagrout-panels" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "0.29"
